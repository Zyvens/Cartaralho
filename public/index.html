<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARTARALHO</title>
  <meta name="description" content="Jogo de cartas multiplayer online onde você cria suas próprias cartas! Reúna os amigos e divirtam-se.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="favicon.png">
</head>
<body>
  <div id="app"></div>
  <div id="toast-container"></div>
  <div id="scoreboard-container"></div>

</html>
