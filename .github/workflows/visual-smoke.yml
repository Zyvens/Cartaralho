name: One-time branch cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/visual-smoke.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete merged and temporary branches
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort)
          echo "Branches before cleanup: ${#branches[@]}"
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi
            echo "Deleting $branch"
            git push origin --delete "$branch"
          done
          echo "Remaining branches:"
          git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort
