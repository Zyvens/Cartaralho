name: Cleanup v1.5.1 branches
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged/superseded v1.5.1 branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for branch in "fix/room-setup-responsive-polish" "feature/v1.5-room-share-layout"; do
            encoded=${branch//\//%2F}
            status=$(curl -sS -o /tmp/delete.json -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/git/refs/heads/$encoded")
            if [ "$status" != "204" ] && [ "$status" != "422" ]; then
              cat /tmp/delete.json
              echo "Failed deleting $branch (HTTP $status)"
              exit 1
            fi
            echo "$branch -> HTTP $status"
          done
