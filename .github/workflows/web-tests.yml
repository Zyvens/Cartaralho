name: Web tests
on:
  pull_request:
    paths: ['web/**','.github/workflows/web-tests.yml']
  push:
    branches: [main, 'refactor/**']
    paths: ['web/**','.github/workflows/web-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Run full contract suite
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 tests/*.test.js 2>&1 | tee test-output.log
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-output
          path: web/test-output.log
