name: Web tests
on:
  pull_request:
    paths: ['web/**','.github/workflows/web-tests.yml']
  push:
    branches: [main, 'refactor/**']
    paths: ['web/**','.github/workflows/web-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Diagnose tests a-d
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/[a-d]*.test.js)
          if ((${#files[@]})); then node --test "${files[@]}"; fi
      - name: Diagnose tests e-h
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/[e-h]*.test.js)
          if ((${#files[@]})); then node --test "${files[@]}"; fi
      - name: Diagnose tests i-l
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/[i-l]*.test.js)
          if ((${#files[@]})); then node --test "${files[@]}"; fi
      - name: Diagnose tests m-p
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/[m-p]*.test.js)
          if ((${#files[@]})); then node --test "${files[@]}"; fi
      - name: Diagnose tests q-t
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/[q-t]*.test.js)
          if ((${#files[@]})); then node --test "${files[@]}"; fi
      - name: Diagnose tests u-z
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/[u-z]*.test.js)
          if ((${#files[@]})); then node --test "${files[@]}"; fi
      - name: Canonical npm test
        run: npm test
