name: One-shot obsolete branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-branch-cleanup.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Delete obsolete remote branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          REPO="$GITHUB_REPOSITORY"

          mapfile -t OPEN_PR_HEADS < <(gh pr list --repo "$REPO" --state open --limit 200 --json headRefName --jq '.[].headRefName')
          mapfile -t BRANCHES < <(git ls-remote --heads origin | sed 's#.*refs/heads/##' | sort)

          echo "Branches found: ${#BRANCHES[@]}"
          echo "Open PR heads preserved: ${#OPEN_PR_HEADS[@]}"

          deleted=0
          preserved=0
          failed=0

          is_open_pr_head() {
            local candidate="$1"
            local head
            for head in "${OPEN_PR_HEADS[@]}"; do
              [[ "$candidate" == "$head" ]] && return 0
            done
            return 1
          }

          for branch in "${BRANCHES[@]}"; do
            if [[ "$branch" == "main" ]]; then
              echo "PRESERVE default branch: $branch"
              preserved=$((preserved + 1))
              continue
            fi

            if is_open_pr_head "$branch"; then
              echo "PRESERVE open PR head: $branch"
              preserved=$((preserved + 1))
              continue
            fi

            echo "DELETE: $branch"
            if git push origin --delete "$branch"; then
              deleted=$((deleted + 1))
            else
              echo "FAILED: $branch" >&2
              failed=$((failed + 1))
            fi
          done

          echo "SUMMARY deleted=$deleted preserved=$preserved failed=$failed"

          echo "Remaining remote heads:"
          git ls-remote --heads origin | sed 's#.*refs/heads/##' | sort

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
